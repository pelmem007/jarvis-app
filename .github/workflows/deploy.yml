name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          mkdir -p extracted
          unzip -q app.zip -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find project root
        id: find_root
        run: |
          PKG_DIR=$(find extracted -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "Ошибка: package.json не найден!"
            exit 1
          fi
          echo "Корень проекта: $PKG_DIR"
          echo "root_dir=$PKG_DIR" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Rewrite config files
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          cat > src/main.tsx << 'ENDOFMAIN'
          import { StrictMode } from 'react'
          import { createRoot } from 'react-dom/client'
          import { BrowserRouter } from 'react-router'
          import './index.css'
          import App from './App.tsx'

          createRoot(document.getElementById('root')!).render(
            <StrictMode>
              <BrowserRouter>
                <App />
              </BrowserRouter>
            </StrictMode>,
          )
          ENDOFMAIN

          cat > vite.config.ts << 'ENDOFCONFIG'
          import path from "path"
          import { fileURLToPath } from "url"
          import react from "@vitejs/plugin-react"
          import { defineConfig } from "vite"
          import { VitePWA } from 'vite-plugin-pwa'

          const __dirname = path.dirname(fileURLToPath(import.meta.url))

          export default defineConfig({
            base: './',
            plugins: [
              react(),
              VitePWA({
                registerType: 'autoUpdate',
                injectRegister: 'script',
                includeAssets: ['favicon.png', 'icons/*.png'],
                manifest: {
                  name: 'JARVIS — офлайн ассистент',
                  short_name: 'JARVIS',
                  description: 'Полностью автономный голосовой ассистент',
                  lang: 'ru',
                  theme_color: '#050810',
                  background_color: '#050810',
                  display: 'standalone',
                  orientation: 'portrait',
                  start_url: './',
                  icons: [
                    { src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' },
                    { src: 'icons/icon-512.png', sizes: '512x512', type: 'image/png' },
                    { src: 'icons/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
                  ],
                },
                workbox: {
                  globPatterns: ['**/*.{js,css,html,png,svg,woff2}'],
                  maximumFileSizeToCacheInBytes: 6 * 1024 * 1024,
                  navigateFallback: 'index.html',
                },
              }),
            ],
            resolve: {
              alias: { "@": path.resolve(__dirname, "./src") },
            },
          });
          ENDOFCONFIG

      - name: Build project
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_root.outputs.root_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
