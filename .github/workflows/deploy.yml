name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          mkdir -p extracted
          unzip -q app.zip -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find project root and debug
        id: find_root
        run: |
          PKG_DIR=$(find extracted -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "Ошибка: package.json не найден!"
            exit 1
          fi
          echo "Корень проекта: $PKG_DIR"
          echo "root_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          echo "===== Содержимое корня ====="
          ls -la "$PKG_DIR"
          echo "===== Содержимое src (если есть) ====="
          ls -la "$PKG_DIR/src" 2>/dev/null || echo "нет папки src"
          echo "===== Содержимое src/lib (если есть) ====="
          ls -la "$PKG_DIR/src/lib" 2>/dev/null || echo "нет папки src/lib"
          echo "===== Поиск файла db.ts ====="
          find "$PKG_DIR" -name "db.ts" -not -path "*/node_modules/*" || echo "db.ts не найден"

      - name: Install dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Rewrite config and main files
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          cat > src/main.tsx << 'ENDOFMAIN'
          import { StrictMode } from 'react'
          import { createRoot } from 'react-dom/client'
          import { BrowserRouter } from 'react-router'
          import './index.css'
          import App from './App.tsx'

          createRoot(document.getElementById('root')!).render(
            <StrictMode>
              <BrowserRouter>
                <App />
              </BrowserRouter>
            </StrictMode>,
          )
          ENDOFMAIN

          cat > vite.config.ts << 'ENDOFCONFIG'
          import path from "path"
          import fs from "fs"
          import { fileURLToPath } from "url"
          import react from "@vitejs/plugin-react"
          import { defineConfig } from "vite"

          const __dirname = path.dirname(fileURLToPath(import.meta.url))
          const SRC = path.resolve(__dirname, 'src')

          function manualAlias() {
            return {
              name: 'manual-alias',
              enforce: 'pre',
              resolveId(source) {
                if (!source.startsWith('@/')) return null
                const base = path.join(SRC, source.slice(2))
                const exts = ['', '.ts', '.tsx', '.js', '.jsx', '.mjs', '.json']
                for (const ext of exts) {
                  const c = base + ext
                  if (fs.existsSync(c) && fs.statSync(c).isFile()) return c
                }
                for (const name of ['index.ts', 'index.tsx', 'index.js', 'index.jsx']) {
                  const c = path.join(base, name)
                  if (fs.existsSync(c)) return c
                }
                console.warn('[manual-alias] Не найдено:', source, '->', base)
                return null
              }
            }
          }

          export default defineConfig({
            base: './',
            plugins: [
              manualAlias(),
              react()
            ],
            resolve: {
              alias: { "@": SRC },
              extensions: ['.ts', '.tsx', '.js', '.jsx', '.mjs', '.json']
            }
          });
          ENDOFCONFIG

      - name: Build project
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_root.outputs.root_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
