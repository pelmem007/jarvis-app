name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          mkdir -p extracted
          unzip -q app.zip -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find project root
        id: find_root
        run: |
          # Робот ищет файл package.json в любой папке внутри архива
          PKG_DIR=$(find extracted -name "package.json" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "Ошибка: не удалось найти корень проекта (package.json) внутри архива!"
            exit 1
          fi
          echo "Корень проекта найден в: $PKG_DIR"
          echo "root_dir=$PKG_DIR" >> $GITHUB_OUTPUT

      - name: Install dependencies
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Patch code for successful build
        run: |
          # Находим файлы main.tsx и vite.config.ts в любом месте архива
          ROOT_DIR="${{ steps.find_root.outputs.root_dir }}"
          MAIN_TSX=$(find "$ROOT_DIR" -name "main.tsx" | head -n 1)
          VITE_CONFIG=$(find "$ROOT_DIR" -name "vite.config.ts" | head -n 1)

          if [ -n "$MAIN_TSX" ]; then
            sed -i "s/import { registerSW } from 'virtual:pwa-register'//g" "$MAIN_TSX"
            sed -i "s/registerSW({ immediate: true })//g" "$MAIN_TSX"
          fi

          if [ -n "$VITE_CONFIG" ]; then
            sed -i "s/registerType: 'autoUpdate',/registerType: 'autoUpdate', injectRegister: 'script',/g" "$VITE_CONFIG"
          fi

      - name: Build project
        working-directory: ${{ steps.find_root.outputs.root_dir }}
        run: npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.find_root.outputs.root_dir }}/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
